<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="ガチアサリ / ナメロウ金属 / スプラシューター - 詳細模式図">
  <title>ガチアサリ / ナメロウ金属 / スプラシューター - 詳細模式図</title>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#111"/>
    </marker>
    <style>
      .bg { fill: #f7f7f7; }
      .stage { fill: #e9ecef; stroke: #222; stroke-width: 3; }
      .zone { fill: #ffffff; stroke: #555; stroke-width: 2; stroke-dasharray: 8 6; }
      .route { fill: none; stroke: #111; stroke-width: 6; marker-end: url(#arrow); }
      .route2 { fill: none; stroke: #555; stroke-width: 5; stroke-dasharray: 12 8; marker-end: url(#arrow); }
      .danger { fill: #fff; stroke: #111; stroke-width: 4; }
      .avoid { fill: none; stroke: #111; stroke-width: 5; stroke-dasharray: 4 8; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 28px; font-weight: 700; fill: #111; }
      .small { font-size: 22px; font-weight: 600; }
      .tiny { font-size: 18px; font-weight: 500; }
      .caption { font-size: 24px; font-weight: 700; }
      .num { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 26px; font-weight: 800; fill: #fff; }
      .numcircle { fill: #111; }
      .note { fill: #fff; stroke: #222; stroke-width: 2; rx: 12; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="800"/>

  <text class="label" x="600" y="52" text-anchor="middle">ナメロウ金属：詳細</text>
  <text class="tiny" x="600" y="78" text-anchor="middle">初動・打開・防衛・攻め継続の注釈</text>

  <path class="stage" d="M250,100 L950,100 L1030,230 L945,360 L1030,500 L950,700 L250,700 L170,500 L255,360 L170,230 Z"/>
  <rect class="zone" x="410" y="305" width="380" height="190" rx="24"/>
  <rect class="zone" x="490" y="115" width="220" height="70" rx="20"/>
  <rect class="zone" x="490" y="615" width="220" height="70" rx="20"/>
  <text class="small" x="600" y="150" text-anchor="middle">敵ゴール</text>
  <text class="small" x="600" y="655" text-anchor="middle">自ゴール</text>
  <text class="tiny" x="600" y="407" text-anchor="middle">中央</text>

  <path class="route" d="M520,650 C450,595 420,520 450,440 C480,365 525,315 590,285"/>
  <path class="route2" d="M690,648 C785,570 815,495 765,425 C725,370 690,325 640,285"/>
  <path class="route" d="M590,285 C610,230 660,185 718,150"/>
  <path class="route2" d="M445,445 C380,395 355,335 405,260"/>
  <path class="route2" d="M758,445 C830,390 845,320 795,260"/>

  <circle class="danger" cx="720" cy="155" r="44"/>
  <circle class="danger" cx="825" cy="255" r="40"/>
  <circle class="danger" cx="410" cy="255" r="40"/>
  <rect class="danger" x="500" y="520" width="205" height="58" rx="18"/>
  <path class="avoid" d="M500,292 L700,292 L748,398 L700,510 L500,510 L452,398 Z"/>
<circle class="numcircle" cx="520" cy="650" r="20"/><text class="num" x="520" y="659" text-anchor="middle">1</text><circle class="numcircle" cx="590" cy="285" r="20"/><text class="num" x="590" y="294" text-anchor="middle">2</text><circle class="numcircle" cx="720" cy="155" r="20"/><text class="num" x="720" y="164" text-anchor="middle">3</text><circle class="numcircle" cx="600" cy="548" r="20"/><text class="num" x="600" y="557" text-anchor="middle">4</text><circle class="numcircle" cx="410" cy="255" r="20"/><text class="num" x="410" y="264" text-anchor="middle">5</text><circle class="numcircle" cx="825" cy="255" r="20"/><text class="num" x="825" y="264" text-anchor="middle">6</text>
  <rect class="note" x="45" y="100" width="315" height="195"/>
  <text class="caption" x="65" y="138">防衛</text>
  <text class="tiny" x="65" y="174">⑤⑥ 横から入る敵を先に見る</text>
  <text class="tiny" x="65" y="204">自ゴール前は塗り返して</text>
  <text class="tiny" x="65" y="234">ジャンプ投げ・潜伏を拒否</text>
  <text class="tiny" x="65" y="264">パワー持ちは見えたら即共有</text>

  <rect class="note" x="825" y="100" width="330" height="200"/>
  <text class="caption" x="845" y="138">攻め</text>
  <text class="tiny" x="845" y="174">② 7個止めで位置バレ回避</text>
  <text class="tiny" x="845" y="204">③ 人数有利後にゴールへ</text>
  <text class="tiny" x="845" y="234">ウルショはゴール前・高台へ</text>
  <text class="tiny" x="845" y="264">開いたら通常アサリを継続投入</text>

  <rect class="note" x="45" y="555" width="360" height="175"/>
  <text class="caption" x="65" y="593">打開</text>
  <text class="tiny" x="65" y="629">④ 自陣側を塗ってウルショ準備</text>
  <text class="tiny" x="65" y="659">正面単独突破ではなく</text>
  <text class="tiny" x="65" y="689">味方スペシャル・人数有利に合わせる</text>

  <rect class="note" x="790" y="555" width="365" height="175"/>
  <text class="caption" x="810" y="593">避ける動き</text>
  <text class="tiny" x="810" y="629">中央を越えたあと立ち止まらない</text>
  <text class="tiny" x="810" y="659">パワー持ち単独侵入は避ける</text>
  <text class="tiny" x="810" y="689">人数不利なら貝を捨てて生存優先</text>
</svg>