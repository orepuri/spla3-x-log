<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="ガチアサリ / ナメロウ金属 / スプラシューター - サマリ模式図">
  <title>ガチアサリ / ナメロウ金属 / スプラシューター - サマリ模式図</title>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#111"/>
    </marker>
    <style>
      .bg { fill: #f7f7f7; }
      .stage { fill: #e9ecef; stroke: #222; stroke-width: 3; }
      .zone { fill: #ffffff; stroke: #555; stroke-width: 2; stroke-dasharray: 8 6; }
      .route { fill: none; stroke: #111; stroke-width: 6; marker-end: url(#arrow); }
      .route2 { fill: none; stroke: #555; stroke-width: 5; stroke-dasharray: 12 8; marker-end: url(#arrow); }
      .danger { fill: #fff; stroke: #111; stroke-width: 4; }
      .avoid { fill: none; stroke: #111; stroke-width: 5; stroke-dasharray: 4 8; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 28px; font-weight: 700; fill: #111; }
      .small { font-size: 22px; font-weight: 600; }
      .tiny { font-size: 18px; font-weight: 500; }
      .caption { font-size: 24px; font-weight: 700; }
      .num { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 26px; font-weight: 800; fill: #fff; }
      .numcircle { fill: #111; }
      .note { fill: #fff; stroke: #222; stroke-width: 2; rx: 12; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="800"/>

  <text class="label" x="600" y="52" text-anchor="middle">ナメロウ金属：サマリ</text>
  <text class="tiny" x="600" y="78" text-anchor="middle">自作模式図 / 上=敵陣・下=自陣</text>

  <path class="stage" d="M250,100 L950,100 L1030,230 L945,360 L1030,500 L950,700 L250,700 L170,500 L255,360 L170,230 Z"/>
  <rect class="zone" x="410" y="305" width="380" height="190" rx="24"/>
  <rect class="zone" x="490" y="115" width="220" height="70" rx="20"/>
  <rect class="zone" x="490" y="615" width="220" height="70" rx="20"/>
  <text class="small" x="600" y="150" text-anchor="middle">敵ゴール前</text>
  <text class="small" x="600" y="655" text-anchor="middle">自ゴール前</text>
  <text class="small" x="600" y="407" text-anchor="middle">中央：貝回収・主戦場</text>

  <path class="route" d="M530,650 C460,580 435,520 455,455 C480,380 520,330 590,300"/>
  <path class="route2" d="M670,650 C750,575 780,515 750,450 C720,390 690,330 635,300"/>
  <path class="route2" d="M600,310 C620,250 660,210 710,165"/>
  <circle class="danger" cx="760" cy="245" r="42"/>
  <circle class="danger" cx="445" cy="245" r="42"/>
  <path class="avoid" d="M515,300 L690,300 L735,405 L690,505 L515,505 L465,405 Z"/>
<circle class="numcircle" cx="455" cy="455" r="20"/><text class="num" x="455" y="464" text-anchor="middle">1</text><circle class="numcircle" cx="600" cy="300" r="20"/><text class="num" x="600" y="309" text-anchor="middle">2</text><circle class="numcircle" cx="760" cy="245" r="20"/><text class="num" x="760" y="254" text-anchor="middle">3</text><circle class="numcircle" cx="515" cy="575" r="20"/><text class="num" x="515" y="584" text-anchor="middle">4</text>
  <rect class="note" x="50" y="610" width="360" height="150"/>
  <text class="caption" x="70" y="648">読むポイント</text>
  <text class="tiny" x="70" y="684">① 初動は中央左寄りで貝回収</text>
  <text class="tiny" x="70" y="714">② 7個止め→味方と合わせる</text>
  <text class="tiny" x="70" y="744">③ ウルショは高台・ゴール前へ</text>

  <rect class="note" x="790" y="610" width="360" height="115"/>
  <text class="caption" x="810" y="648">NG</text>
  <text class="tiny" x="810" y="684">単独でパワーアサリを持って</text>
  <text class="tiny" x="810" y="714">正面グレートを渡り切ろうとしない</text>
</svg>