  <text class="tiny" x="70" y="734">③ ゴール前は人数有利で一気に</text>

  <rect class="note" x="760" y="95" width="385" height="145"/>
  <text class="caption" x="780" y="133">NG</text>
  <text class="tiny" x="780" y="169">移動床・橋に固執して</text>
