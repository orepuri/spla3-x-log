  <rect class="zone" x="455" y="305" width="290" height="190" rx="26"/>
  <rect class="zone" x="330" y="120" width="190" height="75" rx="18"/>
  <rect class="zone" x="680" y="605" width="190" height="75" rx="18"/>
  <rect class="zone" x="505" y="250" width="190" height="65" rx="22"/>
  <rect class="zone" x="505" y="485" width="190" height="65" rx="22"/>
