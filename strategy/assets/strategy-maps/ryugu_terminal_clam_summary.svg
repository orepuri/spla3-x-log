<circle class="numcircle" cx="640" cy="455" r="20"/><text class="num" x="640" y="464" text-anchor="middle">1</text><circle class="numcircle" cx="600" cy="278" r="20"/><text class="num" x="600" y="287" text-anchor="middle">2</text><circle class="numcircle" cx="425" cy="162" r="20"/><text class="num" x="425" y="171" text-anchor="middle">3</text><circle class="numcircle" cx="775" cy="645" r="20"/><text class="num" x="775" y="654" text-anchor="middle">4</text><circle class="numcircle" cx="490" cy="390" r="20"/><text class="num" x="490" y="399" text-anchor="middle">5</text>
  <rect class="note" x="50" y="600" width="395" height="155"/>
  <text class="caption" x="70" y="638">読むポイント</text>
