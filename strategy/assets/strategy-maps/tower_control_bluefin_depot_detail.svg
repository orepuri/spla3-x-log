<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="ガチヤグラ / カジキ空港 / スプラシューター - 詳細">
  <title>ガチヤグラ / カジキ空港 / スプラシューター - 詳細</title>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#111"/></marker>
    <style>
      .bg { fill: #f8f9fa; }
      .stage { fill: #e9ecef; stroke: #222; stroke-width: 3; }
      .objective { fill: #fff; stroke: #111; stroke-width: 4; stroke-dasharray: 9 7; }
      .goal { fill: #fff; stroke: #555; stroke-width: 2; }
      .route { fill: none; stroke: #111; stroke-width: 6; marker-end: url(#arrow); }
      .route2 { fill: none; stroke: #555; stroke-width: 5; stroke-dasharray: 12 8; marker-end: url(#arrow); }
      .hold { fill: #fff; stroke: #111; stroke-width: 4; }
      .avoid { fill: none; stroke: #111; stroke-width: 5; stroke-dasharray: 4 8; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 28px; font-weight: 800; fill: #111; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 22px; font-weight: 700; fill: #111; }
      .tiny { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 18px; font-weight: 600; fill: #111; }
      .objlabel { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 26px; font-weight: 800; fill: #111; }
      .caption { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 24px; font-weight: 800; fill: #111; }
      .numcircle { fill: #111; }
      .num { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 26px; font-weight: 900; fill: #fff; }
      .note { fill: #fff; stroke: #222; stroke-width: 2; rx: 12; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="800"/>
  <text class="label" x="600" y="52" text-anchor="middle">ガチヤグラ / カジキ空港 / スプラシューター - 詳細</text>
  <text class="tiny" x="600" y="78" text-anchor="middle">自作模式図 / 上=敵陣・下=自陣</text>
  <path class="stage" d="M240,100 L960,100 L1040,230 L935,360 L1030,510 L930,705 L270,705 L170,510 L265,360 L160,230 Z"/>

  <circle class="objective" cx="600" cy="400" r="58"/>
  <text class="objlabel" x="600" y="410" text-anchor="middle">ヤグラ</text>
  <rect class="goal" x="500" y="115" width="200" height="70" rx="18"/>
  <rect class="goal" x="500" y="615" width="200" height="70" rx="18"/>
  <text class="small" x="600" y="160" text-anchor="middle">敵ゴール</text>
  <text class="small" x="600" y="660" text-anchor="middle">自ゴール</text>

  <path class="route" d="M600,650 C555,555 560,480 600,400 C645,315 680,245 610,165"/>
  <path class="route2" d="M600,400 C500,370 445,320 455,245"/>
  <path class="route2" d="M600,400 C700,370 755,320 745,245"/>
  <circle class="hold" cx="600" cy="295" r="42"/>
  <circle class="hold" cx="455" cy="245" r="40"/>
  <circle class="hold" cx="745" cy="245" r="40"/>
  <rect class="hold" x="500" y="525" width="200" height="55" rx="18"/>
  <path class="avoid" d="M485,325 L715,325 L760,455 L690,525 L510,525 L440,455 Z"/>
<circle class="numcircle" cx="600" cy="400" r="20"/><text class="num" x="600" y="409" text-anchor="middle">1</text>
<circle class="numcircle" cx="600" cy="295" r="20"/><text class="num" x="600" y="304" text-anchor="middle">2</text>
<circle class="numcircle" cx="455" cy="245" r="20"/><text class="num" x="455" y="254" text-anchor="middle">3</text>
<circle class="numcircle" cx="745" cy="245" r="20"/><text class="num" x="745" y="254" text-anchor="middle">4</text>
<circle class="numcircle" cx="600" cy="553" r="20"/><text class="num" x="600" y="562" text-anchor="middle">5</text>

  <rect class="note" x="45" y="95" width="365" height="220"/>
  <text class="caption" x="65" y="133">初動・主戦場</text>
  <text class="tiny" x="65" y="169">ヤグラ周辺塗りが初動の軸</text>
  <text class="tiny" x="65" y="199">中央で人数有利を作る</text>
  <text class="tiny" x="65" y="229">水際・段差下で孤立しない</text>
  <rect class="note" x="790" y="95" width="365" height="220"/>
  <text class="caption" x="810" y="133">攻め・抑え</text>
  <text class="tiny" x="810" y="169">関門前はヤグラ前を制圧</text>
  <text class="tiny" x="810" y="199">ウルショで高台とヤグラ上へ</text>
  <text class="tiny" x="810" y="229">乗り役と前役を切り替える</text>
  <rect class="note" x="45" y="555" width="365" height="180"/>
  <text class="caption" x="65" y="593">打開・防衛</text>
  <text class="tiny" x="65" y="629">打開は関門前で止める</text>
  <text class="tiny" x="65" y="659">ヤグラ前護衛を先に落とす</text>
  <text class="tiny" x="65" y="689">高台敵をどかしてから近づく</text>
  <rect class="note" x="790" y="555" width="365" height="180"/>
  <text class="caption" x="810" y="593">避ける動き</text>
  <text class="tiny" x="810" y="629">人数不利で乗り続けない</text>
  <text class="tiny" x="810" y="659">ヤグラ上だけ撃ち続けない</text>
  <text class="tiny" x="810" y="689">段差下で固められない</text>
</svg>