<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="ガチアサリ / リュウグウターミナル / スプラシューター - 詳細模式図">
  <title>ガチアサリ / リュウグウターミナル / スプラシューター - 詳細模式図</title>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#111"/>
    </marker>
    <style>
      .bg { fill: #f7f7f7; }
      .stage { fill: #e9ecef; stroke: #222; stroke-width: 3; }
      .zone { fill: #ffffff; stroke: #555; stroke-width: 2; stroke-dasharray: 8 6; }
      .route { fill: none; stroke: #111; stroke-width: 6; marker-end: url(#arrow); }
      .route2 { fill: none; stroke: #555; stroke-width: 5; stroke-dasharray: 12 8; marker-end: url(#arrow); }
      .danger { fill: #fff; stroke: #111; stroke-width: 4; }
      .avoid { fill: none; stroke: #111; stroke-width: 5; stroke-dasharray: 4 8; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 28px; font-weight: 700; fill: #111; }
      .small { font-size: 22px; font-weight: 600; }
      .tiny { font-size: 18px; font-weight: 500; }
      .caption { font-size: 24px; font-weight: 700; }
      .num { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 26px; font-weight: 800; fill: #fff; }
      .numcircle { fill: #111; }
      .note { fill: #fff; stroke: #222; stroke-width: 2; rx: 12; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="800"/>

  <text class="label" x="600" y="52" text-anchor="middle">リュウグウターミナル：詳細</text>
  <text class="tiny" x="600" y="78" text-anchor="middle">初動・打開・防衛・攻め継続の注釈</text>

  <path class="stage" d="M260,95 L940,95 L1020,230 L910,315 L980,465 L900,705 L300,705 L220,465 L290,315 L180,230 Z"/>
  <rect class="zone" x="455" y="305" width="290" height="190" rx="26"/>
  <rect class="zone" x="330" y="120" width="190" height="75" rx="18"/>
  <rect class="zone" x="680" y="605" width="190" height="75" rx="18"/>
  <rect class="zone" x="505" y="250" width="190" height="65" rx="22"/>
  <rect class="zone" x="505" y="485" width="190" height="65" rx="22"/>
  <text class="small" x="425" y="162" text-anchor="middle">敵ゴール</text>
  <text class="small" x="775" y="647" text-anchor="middle">自ゴール</text>
  <text class="tiny" x="600" y="407" text-anchor="middle">中央</text>

  <path class="route" d="M775,645 C700,580 655,520 640,455 C622,380 570,320 500,275"/>
  <path class="route2" d="M775,645 C855,565 845,470 785,405 C725,340 670,305 605,282"/>
  <path class="route" d="M500,275 C465,230 440,190 425,162"/>
  <path class="route2" d="M488,395 C405,390 355,350 305,275"/>
  <path class="route2" d="M712,405 C795,405 850,360 895,285"/>

  <circle class="danger" cx="600" cy="278" r="43"/>
  <circle class="danger" cx="425" cy="162" r="45"/>
  <circle class="danger" cx="775" cy="647" r="46"/>
  <circle class="danger" cx="305" cy="275" r="39"/>
  <circle class="danger" cx="895" cy="285" r="39"/>
  <rect class="danger" x="520" y="515" width="160" height="56" rx="18"/>
  <path class="avoid" d="M470,325 L730,325 L748,470 L510,470 Z"/>
<circle class="numcircle" cx="640" cy="455" r="20"/><text class="num" x="640" y="464" text-anchor="middle">1</text><circle class="numcircle" cx="600" cy="278" r="20"/><text class="num" x="600" y="287" text-anchor="middle">2</text><circle class="numcircle" cx="425" cy="162" r="20"/><text class="num" x="425" y="171" text-anchor="middle">3</text><circle class="numcircle" cx="775" cy="647" r="20"/><text class="num" x="775" y="656" text-anchor="middle">4</text><circle class="numcircle" cx="305" cy="275" r="20"/><text class="num" x="305" y="284" text-anchor="middle">5</text><circle class="numcircle" cx="895" cy="285" r="20"/><text class="num" x="895" y="294" text-anchor="middle">6</text><circle class="numcircle" cx="600" cy="543" r="20"/><text class="num" x="600" y="552" text-anchor="middle">7</text>
  <rect class="note" x="45" y="95" width="350" height="220"/>
  <text class="caption" x="65" y="133">防衛</text>
  <text class="tiny" x="65" y="169">④ 自ゴール前は常に塗り返す</text>
  <text class="tiny" x="65" y="199">⑤⑥ 横抜け・ジャンプ先を警戒</text>
  <text class="tiny" x="65" y="229">敵パワー持ちだけでなく</text>
  <text class="tiny" x="65" y="259">通常アサリ持ちの追加投入を止める</text>

  <rect class="note" x="805" y="95" width="350" height="210"/>
  <text class="caption" x="825" y="133">攻め</text>
  <text class="tiny" x="825" y="169">② 橋・移動床まわりで人数有利</text>
  <text class="tiny" x="825" y="199">③ ゴール前は一気に詰める</text>
  <text class="tiny" x="825" y="229">パワー作成は近場で</text>
  <text class="tiny" x="825" y="259">位置バレ時間を短くする</text>

  <rect class="note" x="45" y="555" width="365" height="180"/>
  <text class="caption" x="65" y="593">打開</text>
  <text class="tiny" x="65" y="629">⑦ 自陣高めを塗ってウルショ準備</text>
  <text class="tiny" x="65" y="659">中央橋の敵・ゴール前待機に撃つ</text>
  <text class="tiny" x="65" y="689">味方の復帰を待ってから中央へ</text>

  <rect class="note" x="790" y="555" width="365" height="180"/>
  <text class="caption" x="810" y="593">避ける動き</text>
  <text class="tiny" x="810" y="629">中央低地で長く撃ち合わない</text>
  <text class="tiny" x="810" y="659">パワー持ちで移動床上に滞在しない</text>
  <text class="tiny" x="810" y="689">ゴール前単独潜伏に頼りすぎない</text>
</svg>