<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="ガチアサリ / リュウグウターミナル / スプラシューター - サマリ模式図">
  <title>ガチアサリ / リュウグウターミナル / スプラシューター - サマリ模式図</title>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#111"/>
    </marker>
    <style>
      .bg { fill: #f7f7f7; }
      .stage { fill: #e9ecef; stroke: #222; stroke-width: 3; }
      .zone { fill: #ffffff; stroke: #555; stroke-width: 2; stroke-dasharray: 8 6; }
      .route { fill: none; stroke: #111; stroke-width: 6; marker-end: url(#arrow); }
      .route2 { fill: none; stroke: #555; stroke-width: 5; stroke-dasharray: 12 8; marker-end: url(#arrow); }
      .danger { fill: #fff; stroke: #111; stroke-width: 4; }
      .avoid { fill: none; stroke: #111; stroke-width: 5; stroke-dasharray: 4 8; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 28px; font-weight: 700; fill: #111; }
      .small { font-size: 22px; font-weight: 600; }
      .tiny { font-size: 18px; font-weight: 500; }
      .caption { font-size: 24px; font-weight: 700; }
      .num { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 26px; font-weight: 800; fill: #fff; }
      .numcircle { fill: #111; }
      .note { fill: #fff; stroke: #222; stroke-width: 2; rx: 12; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="800"/>

  <text class="label" x="600" y="52" text-anchor="middle">リュウグウターミナル：サマリ</text>
  <text class="tiny" x="600" y="78" text-anchor="middle">自作模式図 / 上=敵陣・下=自陣</text>

